# Install:
#   sudo cp deploy/nginx/live.conf /etc/nginx/sites-available/yachts-live
#   sudo ln -sf /etc/nginx/sites-available/yachts-live /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then:
#   sudo certbot --nginx -d live.a-s-m.yachts -d api.live.a-s-m.yachts

server {
    listen 80;
    server_name live.a-s-m.yachts;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name api.live.a-s-m.yachts;
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
