# Usage:
#   cp .env.staging.example .env   # or .env.live.example
#   docker compose -p yachts-staging up -d --build
#   docker compose -p yachts-live up -d --build
#
# Bind ports to 127.0.0.1 — nginx terminates TLS on the public hostnames.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-${NEXT_PUBLIC_API_URL}}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-${NEXT_PUBLIC_API_URL}}
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_HOST: db
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-yachts}
      DATABASE_PORT: 5432
      SERVER_URL: ${SERVER_URL}
      CLIENT_URL: ${CLIENT_URL}
      CLIENT_URLS: ${CLIENT_URLS:-}
      UPLOADS_DIR: /app/uploads
      ZOHO_APP_PASSWORD: ${ZOHO_APP_PASSWORD:-}
      ZOHO_EMAIL: ${ZOHO_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - uploads_data:/app/uploads
    command: ["npm", "run", "start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-yachts}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
